<b>Addition Component</b>
    <br>Number 1:
    <input type="number" [(ngModel)]="addNum1">
    <br>Number 2:
    <input type="number" [(ngModel)]="addNum2">
    <br><button (click)="getAddition()">Add</button>
    <br>Result: {{additionResult}}
    <hr>
    <b>Subtraction Component</b>
    <br>Number 1:
    <input type="number" [(ngModel)]="subNum1">
    <br>Number 2:
    <input type="number" [(ngModel)]="subNum2">
    <br><button (click)="getSubtraction()">Subtract</button>
<br>Result: {{subtractionResult}}
